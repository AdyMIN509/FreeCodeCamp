<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Cards</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
	<main id="playing-cards">
		<div class="card">
			<div class="left">
				<span class="valeur">A</span>
				<span class="type">♠</span>
			</div>
			<div class="middle">♠</div>
			<div class="right">
				<span class="valeur">A</span>
				<span class="type">♠</span>
			</div>
		</div>
		<div class="card">
			<div class="left">
				<span class="valeur">2</span>
				<span class="type">♣</span>
			</div>
			<div class="middle">♣<span class="reverse">♣</span></div>
			<div class="right">
				<span class="valeur">2</span>
				<span class="type">♣</span>
			</div>
		</div>
		<div class="card red">
			<div class="left">
				<span class="valeur">3</span>
				<span class="type">♥</span>
			</div>
			<div class="middle">♥ ♥<span class="reverse">♥</span></div>
			<div class="right">
				<span class="valeur">3</span>
				<span class="type">♥</span>
			</div>
		</div>
		<div class="card red">
			<div class="left">
				<span class="valeur">5</span>
				<span class="type">♦</span>
			</div>
			<div class="middle">♦ ♦<span class="reverse">♦</span>♦ ♦</div>
			<div class="right">
				<span class="valeur">5</span>
				<span class="type">♦</span>
			</div>
		</div>
	</main>
</body>

</html>
