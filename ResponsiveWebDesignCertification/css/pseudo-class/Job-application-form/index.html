<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Job application form</title>
		<link rel="stylesheet" href="styles.css">
	</head>
	<body>
		<div class="container">
			<h1>Job Application From</h1>
			<form action="https://example.com/">
				<label for="name">Full Name:</label>
				<input type="text" id="name" name="full-name" placeholder="Enter your full name" required>
				<label for="email">Email:</label>
				<input type="email" id="email" name="email" placeholder="Enter your email" required>
				<label for="position">Position:</label>
				<select name="position" id="position" required>
					<option value="n/a" disabled selected hidden>Select a position</option>
					<option value="manager">Manager</option>
					<option value="developper">Developper</option>
					<option value="CFO">CFO</option>
				</select>
				<fieldset class="radio-group">
					<legend>Availability</legend>
					<input type="radio" value="full-time" class="radio-btn" name="availability" id="full-time">
					<label for="full-time">Full-time</label>
					<input type="radio" value="part-time"  class="radio-btn" name="availability" id="part-time">
					<label for="part-time">Part-time</label>
				</fieldset>
				<label for="message">Why do you want this job?</label>
					<textarea name="message" id="message" placeholder="Write your motivation" cols="10" rows="30" required></textarea>
				<button type="submit">Submit Application</button>
			</form>
		</div>
	</body>
</html>
