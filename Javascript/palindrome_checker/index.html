<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Palindrome Checker</title>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<main class="card">
		<h1>Palindrome Checker</h1>
		<label for="text-input">Enter the text to test here:</label>
		<input type="text" name="text-input" id="text-input" placeholder="Enter your text">

		<button type="button" id="check-btn">Check the sentence</button>
		<!-- Result will be displayed here -->
		<p id="result"></p>
	</main>
<script src="script.js"></script>
</body>

</html>
